<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Feedback Fprm</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    </head>
    <body class="container">
        <h2 class="my-4">Feedback Form</h2>
        <form id="feedbackForm">
            <label for='name'>Name: </label>
            <input type='text' id='name' class="form-control"/>
            <br/>
            <label for='feedback'>Feedback: </label>
            <textarea type='text' id='feedback' class="form-control"></textarea>
            <br/>
            <label for='rating'>Rate our Service: </label><br/>
            <input type='radio' name='rating' value="excellent"/>Excellent<br/>
            <input type='radio' name='rating' value="good"/>Good<br/>
            <input type='radio' name='rating' value="fair"/>Fair
            <br/><br/>
            <label for='interests'>Select topic of interest: </label><br/>
            <input type='checkbox' name='interests' value="Technology"/>Technology<br/>
            <input type='checkbox' name='interests' value="Travel"/>Travel<br/>
            <input type='checkbox' name='interests' value="Food"/>Food
            <br/><br/>
            <label for='experience'>Overall Experience: </label><br/>
            <select id="experience" class="form-select">
                <option value="Very Satisfied" >Very Satisfied</option>
                <option value="Satisfied">Satisfied</option>
                <option value="Neutral">Neutral</option>
            </select><br/>
            <input type="submit" value="Submit" class="btn btn-primary"/>
        </form> 
        <section id="feedbackSection"></section>
        <script src='index.js'></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    </body>
</html>
