<!DOCTYPE html>
<html>
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>Job Portal</title>
    <link
      href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css'
      rel='stylesheet'
      integrity='sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT'
      crossorigin='anonymous'
    />
  </head>

  <body>
    <header class='bg-light'>
      <nav class='navbar navbar-expand-lg'>
        <div class='container'>
          <a href='index.html' class='navbar-brand'>Job Portal</a>
          <button
            class='navbar-toggler'
            data-bs-target='#collapsibleElement'
            data-bs-toggle='collapse'
          >
            <span class='navbar-toggler-icon'></span>
          </button>
          <div id='collapsibleElement' class='collapse navbar-collapse'>
            <ul class='navbar-nav'>
              <li class='nav-item'>
                <a class='nav-link' href='index.html'>Home</a>
              </li>
              <li class='nav-item'>
                <a class='nav-link' href='jobs.html'>Jobs</a>
              </li>
              <li class='nav-item'>
                <a class='nav-link' href='report.html'>Report</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class='container'>
      <h1 class='my-4'>Jobs Details</h1>
      <div id='jobDetails'></div>
    </main>
    <script
      src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js'
      integrity='sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO'
      crossorigin='anonymous'
    ></script>
    <script>
      const jobs = [
        {
          id: 1,
          title: 'Software Engineer',
          category: 'IT',
          location: 'New York',
          postDate: '2023-01-15',
          details: 'Job description for a software engineer.',
        },
        {
          id: 2,
          title: 'Financial Analyst',
          category: 'Finance',
          location: 'San Francisco',
          postDate: '2023-02-20',
          details: 'Job description for a financial analyst.',
        },
        {
          id: 3,
          title: 'Marketing Manager',
          category: 'Marketing',
          location: 'San Francisco',
          postDate: '2023-04-05',
          details: 'Job description for a marketing manager.',
        },
      ];

      const jobDetailSection = document.querySelector('#jobDetails');
      let job;

      function getJobId() {
        const url = new URL(window.location.href);
        return url.searchParams.get('id');
      }
      const jobId = parseInt(getJobId());

      for (let i = 0; i <= jobs.length - 1; i++) {
        if (jobs[i].id === jobId) {
          job = jobs[i];
        }
      }

      jobDetailSection.innerHTML = `
        <div class='card container'>
          <div class='d-flex justify-content-between my-2'>
            <h5 class='fw-6'>${job.title}</h5>
            <span>Post Date: ${job.postDate}</span>
          </div>
          <p>
            <strong>Category: </strong>
            ${job.category}
          </p>
          <p>
            <strong>Location: </strong>
            ${job.location}
          </p>
          <p>
            <strong>Details: </strong>
            ${job.details}
          </p>
        </div>
      `
    </script>
  </body>
</html>
