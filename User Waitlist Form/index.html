<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <title>User waitlist Form</title>
        <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css' rel='stylesheet' integrity='sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT' crossorigin='anonymous'>
    </head>
    <body class='container py-5'>
        <h1>User Waitlist Form</h1>
        <form id='userWaitlistForm'>
            <label for='fullname'>Fullname: </label>
            <input type='text' class='form-control' id='fullname'/><br/>
            <label for='phoneNo'>Phone No: </label>
            <input type='number' class='form-control' id='phoneNo'/><br/>
            <label for='email'>Email Id: </label>
            <input type='email' class='form-control' id='email'/><br/>
            <label for='gender'>Gender: </label><br/>
            <input type='radio' name='gender' value='Male'/>Male<br/>
            <input type='radio' name='gender' value='Female'/>Female<br/>
            <input type='radio' name='gender' value='Others'/>Others<br/><br/>
            <label for='isDropout'>Are you a college graduate? </label><br/>
            <input type='radio' name='dropout' value='Yes'/>Yes<br/>
            <input type='radio' name='dropout' value='No'/>No<br/>
            <input type='radio' name='dropout' value='Dropout'/>Dropout<br/><br/>
            <label>Are you working full-time or part-time?</label><br/>
            <select class='form-select' id='workHours'>
                <option value='Full-time'>Full-time</option>
                <option value='Part-time'>Part-time</option>
            </select><br/>
            <label for='reason'>Why do you want to learn weeb development?</label><br/>
            <textarea id='reason' class='form-control'></textarea><br/>
            <label>How did you come to know about us?</label><br/>
            <input type='checkbox' name='know' value='Linkedin' />Linkedin<br/>
            <input type='checkbox' name='know' value='Youtube' />Youtube<br/>
            <input type='checkbox' name='know' value='Instagram' />Instagram<br/>
            <input type='checkbox' name='know' value='Twitter' />Twitter<br/>
            <input type='checkbox' name='know' value='Friends' />Friends<br/>
            <br/>
            <input type='submit' value='Submit' />
        </form>
        <section id="submittedForm"></section>
        <script src='index.js'></script>
    </body>
</html>
